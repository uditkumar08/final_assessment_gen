apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-ai-grafana-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Enterprise Loki
        uid: enterprise-loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
