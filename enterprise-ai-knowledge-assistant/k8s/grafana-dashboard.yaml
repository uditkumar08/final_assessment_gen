apiVersion: v1
kind: ConfigMap
metadata:
  name: enterprise-ai-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  enterprise-ai-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "id": null,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(http_requests_total{namespace=\"default\",service=\"backend-service\"}[5m]))",
              "legendFormat": "requests/s",
              "refId": "A"
            }
          ],
          "title": "Backend request rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"default\",service=\"backend-service\"}[5m])))",
              "legendFormat": "p95",
              "refId": "A"
            }
          ],
          "title": "Backend p95 request latency",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (status) (rate(http_requests_total{namespace=\"default\",service=\"backend-service\"}[5m]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "title": "Requests by status class",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "color": "red",
                      "text": "DOWN"
                    },
                    "1": {
                      "color": "green",
                      "text": "UP"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 8
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "up{namespace=\"default\",service=\"backend-service\"}",
              "refId": "A"
            }
          ],
          "title": "Backend availability",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "loki",
            "uid": "enterprise-loki"
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 5,
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "{app=\"backend\",namespace=\"default\"}",
              "refId": "A"
            }
          ],
          "title": "Backend logs",
          "type": "logs"
        }
      ],
      "refresh": "15s",
      "schemaVersion": 39,
      "tags": [
        "enterprise-ai",
        "rag"
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Enterprise AI Knowledge Assistant",
      "uid": "enterprise-ai-assistant",
      "version": 1
    }
