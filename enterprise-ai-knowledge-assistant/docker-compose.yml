
services:

  # 1. Vector Database
  qdrant:
    image: qdrant/qdrant:latest

    ports:
      - "6337:6333"

    volumes:
      - qdrant_data:/qdrant/storage

  # 2. FastAPI Backend
  backend:
    build: .
    
    command: python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      QDRANT_URL: http://qdrant:6333

    volumes:
      - ./storage/uploads:/app/storage/uploads
      - ./storage/processed:/app/storage/processed
      - huggingface_cache:/root/.cache/huggingface

    depends_on:
      - qdrant

  # 3. Streamlit Frontend
  frontend:
    build: .

    command: streamlit run frontend/ui_app.py --server.address 0.0.0.0 --server.port 8501

    ports:
      - "8502:8501"

    environment:
      API_BASE_URL: http://backend:8000

    depends_on:
      - backend

volumes:
  qdrant_data:
  huggingface_cache:
