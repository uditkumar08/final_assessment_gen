name: CI/CD

env:
  IMAGE: ghcr.io/uditkumar08/final_assessment_gen

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-backend.txt
            requirements-frontend.txt
      - run: pip install ruff && ruff check backend frontend
      - run: python -m compileall -q backend frontend

  build-push:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        svc:
          - backend
          - frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.svc }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}-${{ matrix.svc }}:${{ github.sha }}
            ${{ env.IMAGE }}-${{ matrix.svc }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Apply application manifests
        run: kubectl apply -f k8s/qdrant.yaml -f k8s/backend.yaml -f k8s/frontend.yaml -f k8s/grafana-dashboard.yaml -f k8s/grafana-datasource.yaml
      - name: Apply ServiceMonitor when its CRD is installed
        shell: powershell
        run: |
          $crd = kubectl get crd servicemonitors.monitoring.coreos.com --ignore-not-found
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($crd) {
            kubectl apply -f k8s/servicemonitor.yaml
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            Write-Host "ServiceMonitor CRD is not installed; skipping k8s/servicemonitor.yaml."
          }
      - name: Wait for Qdrant
        run: kubectl rollout status deployment/qdrant --namespace default --timeout=180s
      - name: Update application images
        run: |
          kubectl set image deployment/backend backend=${{ env.IMAGE }}-backend:${{ github.sha }} --namespace default
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl set image deployment/frontend frontend=${{ env.IMAGE }}-frontend:${{ github.sha }} --namespace default
      - name: Wait for application rollouts
        run: |
          kubectl rollout status deployment/backend --namespace default --timeout=300s
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          kubectl rollout status deployment/frontend --namespace default --timeout=180s
